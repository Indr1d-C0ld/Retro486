# Retro486 - PC 486 emulato (86Box in WebAssembly) con backend PHP.
# Sito in /var/www/html/retro486, servito sotto /retro486/, solo con password.
# Installazione: conf-available/retro486.conf + a2enconf (vedi installa.sh).
# Su Balthasar AllowOverride e' None: le regole stanno qui.

<Directory /var/www/html/retro486>
    Options -Indexes -MultiViews
    AuthType Basic
    AuthName "Retro486 - accesso riservato"
    AuthUserFile /etc/apache2/.htpasswd-retro486
    Require valid-user

    # WebAssembly a thread: SharedArrayBuffer richiede l'isolamento cross-origin
    <IfModule mod_headers.c>
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set Cross-Origin-Embedder-Policy "require-corp"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
        Header always set X-Robots-Tag "noindex, nofollow"
        <FilesMatch "^(index\.html|version\.json|manifest\.txt)$|\.(js|mjs|css)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <FilesMatch "\.(wasm|woff|png|ico|svg)$">
            Header set Cache-Control "public, max-age=86400"
        </FilesMatch>
    </IfModule>

    AddType application/wasm .wasm
    AddType text/javascript .mjs
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/wasm text/javascript application/javascript text/css application/json
    </IfModule>
</Directory>

# Dati scritti dal backend: niente esecuzione di script, gzip serviti come file binari
<Directory /var/www/html/retro486/dati>
    php_admin_flag engine off
    RemoveEncoding .gz
    RemoveType .gz
    AddType application/octet-stream .gz .img .iso .nvr
    SetEnv no-gzip 1
    <IfModule mod_headers.c>
        Header set Cache-Control "no-store"
    </IfModule>
    <FilesMatch "\.(tmp|php|phtml|phar)$|^\.ricevo-">
        Require all denied
    </FilesMatch>
</Directory>

# Il backend riceve l'hard disk (gzip, pochi MB) e le immagini dei CD
<Directory /var/www/html/retro486/api>
    LimitRequestBody 1073741824
    php_value max_execution_time 300
    php_value memory_limit 256M
    <Files "_comune.php">
        Require all denied
    </Files>
</Directory>

# /retro486 (senza barra) -> /retro486/
RedirectMatch 301 ^/retro486$ /retro486/
